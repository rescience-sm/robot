<!DOCTYPE html>
<html lang="hr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-ZEN // 4:3 Meditation Robot</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Inter & Ubuntu Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- Three.js & Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --sub-color: #f8fafc;
            /* Safe viewport fallback + 4:3 container query sizing (+10% subtitles) */
            --sub-size: clamp(2.31rem, 3.83vw, 3.50rem);
            --orb-size: min(35vw, 47vh);
        }

        @supports (width: 1cqw) {
            :root {
                --sub-size: clamp(2.31rem, 3.83cqw, 3.50rem);
                --orb-size: min(35cqw, 47cqh);
            }
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #01040a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            height: 100dvh;
            width: 100dvw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Strict 4:3 Aspect Ratio Stage Container */
        #app-frame {
            aspect-ratio: 4 / 3;
            width: min(100vw, calc(100vh * 4 / 3));
            height: min(100vh, calc(100vw * 3 / 4));
            width: min(100dvw, calc(100dvh * 4 / 3));
            height: min(100dvh, calc(100dvw * 3 / 4));
            container-type: size;
            position: relative;
            overflow: hidden;
            background:
                radial-gradient(circle at 40% 45%, rgba(14, 165, 233, 0.13) 0%, rgba(8, 15, 30, 0.95) 54%, #030712 100%);
            box-shadow:
                0 0 80px rgba(0, 0, 0, 0.9),
                0 0 0 1px rgba(56, 189, 248, 0.14);
        }

        /* Subtle background dot matrix inside 4:3 frame */
        .bg-grid {
            background-image: radial-gradient(rgba(125, 211, 252, 0.09) 1px, transparent 1px);
            background-size: 26px 26px;
        }

        /* Responsive Layout inside 4:3 Container */
        .stage-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            /* Shifts the robot circle noticeably closer toward the horizontal center */
            padding-left: 16cqw;
            padding-right: 3cqw;
            gap: 3cqw;
        }

        /* Circular Android Portal */
        .orb-portal {
            width: var(--orb-size);
            height: var(--orb-size);
            min-width: 150px;
            min-height: 150px;
            max-width: 560px;
            max-height: 560px;
            border-radius: 9999px;
            position: relative;
            background: radial-gradient(circle at 50% 42%, rgba(15, 29, 52, 0.92) 0%, rgba(5, 10, 22, 0.98) 74%, rgba(2, 6, 15, 1) 100%);
            box-shadow:
                0 0 60px rgba(56, 189, 248, 0.16),
                inset 0 0 42px rgba(56, 189, 248, 0.14),
                0 0 0 1.5px rgba(125, 211, 252, 0.28);
            overflow: hidden;
            cursor: grab;
        }

        .orb-portal:active {
            cursor: grabbing;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            overflow: hidden;
        }

        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Breathing Halo Ring */
        .breath-halo {
            position: absolute;
            inset: -12px;
            border-radius: 9999px;
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            pointer-events: none;
            transition: transform 0.15s linear, border-color 0.4s ease, opacity 0.4s ease;
        }

        /* TV Subtitle Styling (+10% size) with gentle translucent backdrop */
        #tv-subtitle-box {
            background: rgba(6, 12, 24, 0.36);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(148, 163, 184, 0.12);
            color: var(--sub-color);
            font-size: var(--sub-size);
            line-height: 1.38;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.85);
            overflow-wrap: break-word;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 180ms ease-in-out, transform 180ms ease-in-out, color 200ms ease, font-size 200ms ease;
            pointer-events: none;
        }

        #tv-subtitle-box.sub-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Compact adaptation when the 4:3 container is rendered on small viewports */
        @container (max-width: 720px) {
            :root {
                --orb-size: min(36cqw, 44cqh);
                /* +10% mobile proportional scaling */
                --sub-size: clamp(1.15rem, 3.85cqw, 1.85rem);
            }
            .stage-layout {
                padding-left: 11cqw;
                padding-right: 3cqw;
                gap: 2.5cqw;
            }
        }

        /* Ubuntu GNOME Terminal Styling */
        .ubuntu-terminal {
            font-family: 'Ubuntu Mono', monospace;
            background-color: rgba(48, 10, 36, 0.94);
            border: 1px solid rgba(119, 41, 83, 0.75);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
        }

        .ubuntu-titlebar {
            background: linear-gradient(180deg, #3c3b37 0%, #2c2b29 100%);
            border-bottom: 1px solid #1e1d1c;
        }

        .ubuntu-close-dot {
            background-color: #e95420;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .ubuntu-cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #eeeeec;
            vertical-align: middle;
            animation: ubuntuBlink 1.05s steps(2, start) infinite;
        }

        @keyframes ubuntuBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Equalizer voice bars */
        .v-bar {
            width: 3px;
            border-radius: 999px;
            background: #38bdf8;
            transition: height 0.12s ease;
        }

        /* Custom scrollbar for terminal */
        #terminal-log::-webkit-scrollbar {
            width: 5px;
        }
        #terminal-log::-webkit-scrollbar-track {
            background: rgba(25, 5, 20, 0.4);
        }
        #terminal-log::-webkit-scrollbar-thumb {
            background: rgba(233, 84, 32, 0.55);
            border-radius: 9999px;
        }
    </style>
</head>
<body>

    <!-- STRICT 4:3 PAGE FRAME -->
    <div id="app-frame" class="bg-grid flex flex-col justify-between select-none">

        <!-- TOP CONTROL BAR -->
        <header class="w-full px-4 sm:px-6 pt-2.5 pb-1.5 flex flex-wrap items-center justify-between gap-2 z-30 shrink-0">
            <!-- Brand & Phase Status -->
            <div class="flex items-center gap-2.5">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900/75 border border-sky-400/25 backdrop-blur-md">
                    <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
                    <span class="text-[11px] sm:text-xs font-semibold tracking-widest text-sky-100">AURA-ZEN</span>
                    <span id="phase-badge" class="text-[10px] sm:text-[11px] font-mono text-sky-300/85 border-l border-slate-700 pl-2">STANDBY // 02:00</span>
                </div>

                <!-- Voice Activity Bars -->
                <div id="voice-bars" class="flex items-end gap-1 h-4 px-1.5 opacity-25 transition-opacity duration-300">
                    <span class="v-bar h-1.5" id="vb-1"></span>
                    <span class="v-bar h-3" id="vb-2"></span>
                    <span class="v-bar h-2" id="vb-3"></span>
                    <span class="v-bar h-3.5" id="vb-4"></span>
                    <span class="v-bar h-1.5" id="vb-5"></span>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex flex-wrap items-center justify-end gap-1.5 sm:gap-2">
                <!-- Microphone Permission / Status Button -->
                <button type="button" id="btn-mic" onclick="handleMicButtonClick()"
                    class="cursor-pointer active:scale-95 flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-400/40 transition-all shadow-sm">
                    <i id="icon-mic" class="ph-fill ph-microphone text-xs sm:text-sm text-emerald-300"></i>
                    <span id="label-mic">Allow Microphone</span>
                </button>

                <!-- Quick Test Trigger Button -->
                <button type="button" id="btn-test" onclick="triggerTestManual()" title="Run System Test"
                    class="cursor-pointer active:scale-95 flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-900/75 hover:bg-slate-800 text-amber-200 border border-amber-400/30 transition-all">
                    <i class="ph ph-sliders-horizontal text-xs text-amber-300"></i>
                    <span>Test</span>
                </button>

                <!-- Manual Meditation Start / Pause Button -->
                <button type="button" id="btn-play" onclick="toggleMeditationManual()"
                    class="cursor-pointer active:scale-95 flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-sky-500/15 hover:bg-sky-500/25 text-sky-100 border border-sky-400/30 transition-all">
                    <i id="icon-play" class="ph-fill ph-play text-xs text-sky-300"></i>
                    <span id="label-play">Meditation</span>
                </button>

                <!-- Labeled Full Screen Button -->
                <button type="button" id="btn-fs" onclick="toggleFullScreen()" title="Full Screen"
                    class="cursor-pointer active:scale-95 flex items-center gap-1.5 px-2.5 sm:px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-indigo-500/15 hover:bg-indigo-500/25 text-indigo-100 border border-indigo-400/30 transition-all">
                    <i id="icon-fs" class="ph ph-corners-out text-xs text-indigo-300"></i>
                    <span id="label-fs">Full Screen</span>
                </button>

                <!-- Reset Button -->
                <button type="button" id="btn-reset" onclick="resetMeditation()" title="Reset Session"
                    class="cursor-pointer active:scale-95 p-1.5 rounded-full bg-slate-900/75 hover:bg-slate-800 text-slate-300 border border-slate-700/70 transition-all">
                    <i class="ph ph-arrow-counter-clockwise text-xs sm:text-sm"></i>
                </button>

                <!-- Sound Mute/Unmute -->
                <button type="button" id="btn-sound" onclick="toggleSound()" title="Toggle Audio"
                    class="cursor-pointer active:scale-95 p-1.5 rounded-full bg-slate-900/75 hover:bg-slate-800 text-slate-300 border border-slate-700/70 transition-all">
                    <i id="icon-sound" class="ph-fill ph-speaker-high text-xs sm:text-sm text-sky-300"></i>
                </button>
            </div>
        </header>

        <!-- MAIN STAGE: ROBOT ORB SHIFTED MORE TOWARDS CENTER | CROATIAN TV SUBTITLES (+10% SIZE) -->
        <main class="flex-1 w-full min-h-0 z-20 stage-layout">

            <!-- ROBOT ORB PORTAL (Shifted closer to center of the 4:3 frame) -->
            <div class="flex flex-col items-center justify-center shrink-0">
                <div class="relative flex items-center justify-center">
                    <!-- Outer Breathing Ring -->
                    <div id="breath-halo" class="breath-halo"></div>

                    <!-- SVG Orbital Progress Ring -->
                    <svg class="absolute -inset-2.5 w-[calc(100%+20px)] h-[calc(100%+20px)] -rotate-90 pointer-events-none" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="96" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" />
                        <circle id="progress-ring" cx="100" cy="100" r="96" fill="none" stroke="#38bdf8" stroke-width="2.6"
                            stroke-linecap="round" stroke-dasharray="603.18" stroke-dashoffset="0"
                            class="transition-all duration-300" />
                    </svg>

                    <!-- Circular Three.js Container -->
                    <div id="orb-portal" class="orb-portal">
                        <div id="canvas-container"></div>

                        <!-- Subtle HUD Overlay Inside Bottom of Circle -->
                        <div class="absolute bottom-4 inset-x-2 flex flex-col items-center text-center pointer-events-none">
                            <span id="timer-display" class="text-base sm:text-xl font-light tracking-[0.22em] text-sky-100/90 drop-shadow">02:00</span>
                            <span id="breath-instruction" class="text-[9px] sm:text-[11px] uppercase tracking-[0.18em] text-sky-300/75 mt-0.5">READY</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CROATIAN TV SUBTITLES STAGE (+10% Larger Font) -->
            <section class="flex-1 min-w-0 flex items-center justify-start py-2">
                <div class="w-full flex items-center justify-start">
                    <div id="tv-subtitle-box" class="px-6 py-4 rounded-2xl font-normal text-left w-full"></div>
                </div>
            </section>
        </main>

        <!-- BOTTOM UBUNTU GNOME TERMINAL -->
        <footer class="w-full max-w-[88%] mx-auto px-3 pb-2.5 pt-1 z-30 shrink-0">
            <div class="ubuntu-terminal rounded-xl overflow-hidden">
                <!-- Ubuntu Yaru Window Header -->
                <div class="ubuntu-titlebar px-3 py-1 flex items-center justify-between text-[10px] sm:text-[11px] text-stone-200">
                    <div class="flex items-center gap-1.5">
                        <span class="w-2.5 h-2.5 rounded-full ubuntu-close-dot inline-flex items-center justify-center text-[7px] font-bold text-stone-900">×</span>
                        <span class="w-2 h-2 rounded-full bg-stone-600 inline-block"></span>
                        <span class="w-2 h-2 rounded-full bg-stone-600 inline-block"></span>
                    </div>
                    <div class="font-mono tracking-wide text-stone-200/90 truncate">
                        aura@ubuntu: ~/asr-voice-stream (4:3)
                    </div>
                    <div id="terminal-context-tag" class="font-mono text-[10px] text-amber-300/90">
                        ttyASR0 // STANDBY
                    </div>
                </div>

                <!-- Ubuntu Terminal Output Body -->
                <div class="px-3.5 py-2 text-[11px] sm:text-xs leading-relaxed">
                    <div id="terminal-log" class="h-12 sm:h-16 overflow-y-auto space-y-0.5 pr-1 text-[#eeeeec]"></div>
                    <div class="mt-1 pt-1 border-t border-white/10 flex items-center gap-1.5 truncate">
                        <span class="text-[#8ae234] font-bold">aura@ubuntu</span><span class="text-white">:</span><span class="text-[#729fcf] font-bold">~/asr</span><span class="text-white">$</span>
                        <span id="terminal-live-stream" class="text-[#fce94f] truncate">commands: "hi" / "hello", "test", "meditation"</span>
                        <span class="ubuntu-cursor"></span>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        /***********************************************************************
         * 1. GLOBAL STATE & CONFIGURATION
         ***********************************************************************/
        const TOTAL_SECONDS = 120;
        let remainingSeconds = TOTAL_SECONDS;
        let isRunning = false;
        let isCompleted = false;
        let soundEnabled = true;

        let isTransitioningToStart = false;
        let isHandlingVoiceReply = false;
        let isRobotSpeaking = false;
        let isRunningDiagnosticsTest = false;

        // Subtitle State (+10% increased across all presets)
        let subtitleColor = '#f8fafc';
        let subtitleSizeKey = 'md';
        const SUBTITLE_SIZE_MAP = {
            sm: 'clamp(1.78rem, 2.77cqw, 2.44rem)',
            md: 'clamp(2.31rem, 3.83cqw, 3.50rem)',
            lg: 'clamp(2.84rem, 4.75cqw, 4.42rem)',
            xl: 'clamp(3.37rem, 5.81cqw, 5.41rem)'
        };
        let subtitleFadeTimer = null;
        let subtitlePreviewHideTimer = null;
        let currentSubtitleText = '';

        // Complete 2-Minute Guided Meditation Cues (continuous gentle guidance from start to finish)
        const MEDITATION_CUES = [
            {
                atRemaining: 116,
                triggered: false,
                en: "Gently close your eyes, and bring your attention to the natural flow of your breath.",
                hr: "Nježno zatvorite oči i usmjerite pažnju na prirodan ritam svoga daha."
            },
            {
                atRemaining: 102,
                triggered: false,
                en: "Soften your forehead, relax your jaw, and let your hands rest heavy and warm.",
                hr: "Opustite čelo, čeljust i dlanove neka mirno i toplo počivaju."
            },
            {
                atRemaining: 88,
                triggered: false,
                en: "Breathe in slowly through your nose... feeling calm air fill your chest.",
                hr: "Udahnite polako kroz nos... osjećajući kako miran zrak ispunjava prsa."
            },
            {
                atRemaining: 74,
                triggered: false,
                en: "And breathe out gently... releasing any tension from your neck and shoulders.",
                hr: "I lagano izdahnite... otpuštajući svu napetost iz vrata i ramena."
            },
            {
                atRemaining: 60,
                triggered: false,
                en: "You are doing wonderfully. We are already halfway through the meditation.",
                hr: "Odlično vam ide, već smo na polovici meditacije."
            },
            {
                atRemaining: 48,
                triggered: false,
                en: "If any thought appears, simply notice it like a passing cloud, and let it drift away.",
                hr: "Ako se pojavi neka misao, samo je primijetite poput oblaka i pustite da prođe."
            },
            {
                atRemaining: 35,
                triggered: false,
                en: "Feel the quiet stillness inside you between each slow, steady breath.",
                hr: "Osjetite tihu smirenost u sebi između svakog sporog i mirnog daha."
            },
            {
                atRemaining: 23,
                triggered: false,
                en: "Take one more deep, nourishing breath in... and soften your whole body as you exhale.",
                hr: "Udahnite još jednom duboko i iscjeljujuće... te pri izdahu opustite cijelo tijelo."
            },
            {
                atRemaining: 10,
                triggered: false,
                en: "Slowly bring gentle awareness back to your body and the room around you.",
                hr: "Polako vratite blagu svjesnost na svoje tijelo i prostor oko sebe."
            }
        ];

        /***********************************************************************
         * 2. UBUNTU TERMINAL LOGGER & KEYBOARD SHORTCUTS ("hi", "test", "meditation")
         ***********************************************************************/
        function logVoiceTerminal(tag, message, tone = 'info') {
            const logEl = document.getElementById('terminal-log');
            if (!logEl) return;

            const now = new Date();
            const ts = now.toTimeString().split(' ')[0];
            const colorMap = {
                info: 'text-[#eeeeec]',
                cmd: 'text-[#8ae234]',
                cyan: 'text-[#34e2e2]',
                amber: 'text-[#fce94f]',
                pink: 'text-[#ad7fa8]',
                warn: 'text-[#fcaf3e]'
            };

            const line = document.createElement('div');
            line.className = 'truncate';
            line.innerHTML = `<span class="text-stone-400">[${ts}]</span> <span class="${colorMap[tone] || colorMap.info} font-bold">[${tag}]</span> <span>${escapeHtml(message)}</span>`;
            logEl.appendChild(line);

            while (logEl.children.length > 28) {
                logEl.removeChild(logEl.firstChild);
            }
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setTerminalPromptStream(text) {
            const el = document.getElementById('terminal-live-stream');
            if (el) el.textContent = text;
        }

        function setTerminalContextBadge(label) {
            const badge = document.getElementById('terminal-context-tag');
            if (badge) badge.textContent = `ttyASR0 // ${label}`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        // Keyboard listener supporting only "hi", "hello", "test", and "meditation"
        let typedKeyBuffer = '';
        let typedKeyResetTimer = null;
        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (e.key && e.key.length === 1) {
                typedKeyBuffer = (typedKeyBuffer + e.key.toLowerCase()).slice(-14);
                if (typedKeyResetTimer) clearTimeout(typedKeyResetTimer);
                typedKeyResetTimer = setTimeout(() => { typedKeyBuffer = ''; }, 2200);

                if (isRunning || isRunningDiagnosticsTest || isTransitioningToStart) return;

                if (typedKeyBuffer.endsWith('meditation')) {
                    typedKeyBuffer = '';
                    initZenAudio().then(() => processVoiceCommand('meditation'));
                } else if (typedKeyBuffer.endsWith('test')) {
                    typedKeyBuffer = '';
                    initZenAudio().then(() => processVoiceCommand('test'));
                } else if (typedKeyBuffer.endsWith('hello')) {
                    typedKeyBuffer = '';
                    initZenAudio().then(() => processVoiceCommand('hello'));
                } else if (typedKeyBuffer.endsWith('hi')) {
                    // Brief wait so typing "hi" doesn't block other words unless paused
                    const snapshot = typedKeyBuffer;
                    setTimeout(() => {
                        if (typedKeyBuffer === snapshot && !isRunning && !isRunningDiagnosticsTest) {
                            typedKeyBuffer = '';
                            initZenAudio().then(() => processVoiceCommand('hi'));
                        }
                    }, 450);
                }
            }
        });

        /***********************************************************************
         * 3. SUBTITLE ENGINE (+10% SIZES & SMOOTH FADE TRANSITIONS)
         ***********************************************************************/
        function showSubtitleText(newText, autoHideMs = 0) {
            const box = document.getElementById('tv-subtitle-box');
            if (!box) return;

            if (subtitleFadeTimer) {
                clearTimeout(subtitleFadeTimer);
                subtitleFadeTimer = null;
            }
            if (subtitlePreviewHideTimer) {
                clearTimeout(subtitlePreviewHideTimer);
                subtitlePreviewHideTimer = null;
            }

            const clean = (newText || '').trim();

            if (!clean) {
                box.classList.remove('sub-visible');
                subtitleFadeTimer = setTimeout(() => {
                    currentSubtitleText = '';
                    box.textContent = '';
                }, 185);
                return;
            }

            if (box.classList.contains('sub-visible') && currentSubtitleText === clean) {
                if (autoHideMs > 0) {
                    subtitlePreviewHideTimer = setTimeout(() => showSubtitleText(''), autoHideMs);
                }
                return;
            }

            if (box.classList.contains('sub-visible') && currentSubtitleText !== '') {
                box.classList.remove('sub-visible');
                subtitleFadeTimer = setTimeout(() => {
                    currentSubtitleText = clean;
                    box.textContent = clean;
                    box.classList.add('sub-visible');
                    if (autoHideMs > 0) {
                        subtitlePreviewHideTimer = setTimeout(() => showSubtitleText(''), autoHideMs);
                    }
                }, 180);
            } else {
                currentSubtitleText = clean;
                box.textContent = clean;
                requestAnimationFrame(() => {
                    box.classList.add('sub-visible');
                });
                if (autoHideMs > 0) {
                    subtitlePreviewHideTimer = setTimeout(() => showSubtitleText(''), autoHideMs);
                }
            }
        }

        function applySubtitleSettings(colorHex = null, sizeKey = null) {
            if (colorHex) {
                subtitleColor = colorHex;
                document.documentElement.style.setProperty('--sub-color', subtitleColor);
            }
            if (sizeKey && SUBTITLE_SIZE_MAP[sizeKey]) {
                subtitleSizeKey = sizeKey;
                document.documentElement.style.setProperty('--sub-size', SUBTITLE_SIZE_MAP[sizeKey]);
            }
        }

        /***********************************************************************
         * 4. ZEN AUDIO ENGINE & SOFT MEDITATION CHIMES (NON-BLOCKING)
         ***********************************************************************/
        let audioReady = false;
        let audioInitializing = null;
        let cueSynth = null;
        let bgChimeSynth = null;
        let masterReverb = null;
        let chimeFilter = null;
        let bgChimeTimer = null;
        const CHIME_NOTES = ['G4', 'A4', 'C5', 'D5', 'E5', 'G5', 'A5'];
        let lastChimeIndex = -1;

        async function initZenAudio() {
            if (audioReady) return;
            if (typeof Tone === 'undefined') return;
            if (audioInitializing) return audioInitializing;

            audioInitializing = (async () => {
                try {
                    // Race Tone.start() against a 450ms timeout so UI buttons NEVER hang
                    await Promise.race([
                        Tone.start(),
                        new Promise(resolve => setTimeout(resolve, 450))
                    ]);

                    masterReverb = new Tone.Reverb({ decay: 4.8, wet: 0.52 }).toDestination();
                    await Promise.race([
                        masterReverb.generate(),
                        new Promise(resolve => setTimeout(resolve, 450))
                    ]);

                    chimeFilter = new Tone.Filter({
                        frequency: 2100,
                        type: 'lowpass',
                        rolloff: -12
                    }).connect(masterReverb);

                    cueSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.06, decay: 2.1, sustain: 0.08, release: 3.2 }
                    }).connect(masterReverb);
                    cueSynth.volume.value = -14;

                    // Delicate, airy background wind-chimes (soft & never overpowering)
                    bgChimeSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: 'sine' },
                        envelope: { attack: 0.09, decay: 1.9, sustain: 0.04, release: 3.4 }
                    }).connect(chimeFilter);
                    bgChimeSynth.volume.value = -21;

                    audioReady = true;
                } catch (err) {
                    console.warn('Zen audio init fallback:', err);
                } finally {
                    audioInitializing = null;
                }
            })();

            return audioInitializing;
        }

        function playCueChime(note = 'E5', velocity = 0.40) {
            if (!soundEnabled || !audioReady || !cueSynth) return;
            try {
                cueSynth.triggerAttackRelease(note, '2n', undefined, velocity);
            } catch (e) {}
        }

        function scheduleNextSoftChime() {
            if (!isRunning || !soundEnabled) return;
            const nextDelayMs = 3400 + Math.random() * 2000;

            bgChimeTimer = setTimeout(() => {
                if (!isRunning || !soundEnabled) return;

                if (audioReady && bgChimeSynth) {
                    try {
                        let idx = Math.floor(Math.random() * CHIME_NOTES.length);
                        if (idx === lastChimeIndex) idx = (idx + 1) % CHIME_NOTES.length;
                        lastChimeIndex = idx;

                        const note = CHIME_NOTES[idx];
                        // Duck volume gently when robot voice is speaking
                        const vel = isRobotSpeaking ? 0.13 : 0.25;
                        bgChimeSynth.triggerAttackRelease(note, '2n', undefined, vel);

                        // Occasional soft harmonic shimmer fifth
                        if (!isRobotSpeaking && Math.random() < 0.28) {
                            const shimmerNote = CHIME_NOTES[(idx + 2) % CHIME_NOTES.length];
                            setTimeout(() => {
                                if (isRunning && soundEnabled && bgChimeSynth && !isRobotSpeaking) {
                                    try { bgChimeSynth.triggerAttackRelease(shimmerNote, '2n', undefined, 0.16); } catch (e) {}
                                }
                            }, 420);
                        }
                    } catch (e) {}
                }

                scheduleNextSoftChime();
            }, nextDelayMs);
        }

        function startBackgroundChimes() {
            stopBackgroundChimes();
            if (!soundEnabled) return;
            // Play one gentle opening chime softly after 1.1s, then continue organically
            bgChimeTimer = setTimeout(() => {
                if (isRunning && soundEnabled && audioReady && bgChimeSynth) {
                    try {
                        bgChimeSynth.triggerAttackRelease('E5', '2n', undefined, isRobotSpeaking ? 0.13 : 0.24);
                    } catch (e) {}
                }
                scheduleNextSoftChime();
            }, 1100);
        }

        function stopBackgroundChimes() {
            if (bgChimeTimer) {
                clearTimeout(bgChimeTimer);
                bgChimeTimer = null;
            }
            if (bgChimeSynth) {
                try { bgChimeSynth.releaseAll(); } catch (e) {}
            }
        }

        /***********************************************************************
         * 5. NATURAL VOICE SYNTHESIZER (CHROME GC-SAFE & RELIABLE)
         ***********************************************************************/
        let availableVoices = [];
        let micIgnoreUntil = 0;
        let activePreDelayTimer = null;
        let activePostDelayTimer = null;
        let speechFallbackTimer = null;
        let speechKeepAliveInterval = null;
        // Keep global reference so Chrome V8 never garbage-collects active utterance mid-meditation
        window.__auraActiveUtterance = null;

        const VOICE_PACE_PROFILES = {
            calm:           { rate: 0.90, pitch: 1.00 },
            pre_meditation: { rate: 0.80, pitch: 0.96 },
            meditation:     { rate: 0.82, pitch: 0.96 }
        };

        function loadBrowserVoices() {
            if (!('speechSynthesis' in window)) return;
            availableVoices = window.speechSynthesis.getVoices() || [];
        }

        if ('speechSynthesis' in window) {
            loadBrowserVoices();
            window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
        }

        function selectBestNaturalVoice() {
            if (!('speechSynthesis' in window)) return null;
            if (!availableVoices.length) {
                availableVoices = window.speechSynthesis.getVoices() || [];
            }
            const enVoices = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
            if (!enVoices.length) return availableVoices[0] || null;

            const scoreVoice = (v) => {
                let s = 0;
                const name = v.name || '';
                if (/Natural|Neural|Online/i.test(name)) s += 65;
                if (/Premium|Enhanced|Studio|Siri/i.test(name)) s += 45;
                if (/Aria|Jenny|Ava|Sonia|Libby|Samantha|Serena|Karen|Moira|Google UK English Female|Google US English/i.test(name)) s += 30;
                if (!v.localService) s += 15;
                if (/en-GB|en-US/i.test(v.lang)) s += 10;
                if (/Compact|espeak|Festival/i.test(name)) s -= 40;
                return s;
            };

            return enVoices.slice().sort((a, b) => scoreVoice(b) - scoreVoice(a))[0];
        }

        function normalizeSpeechText(str) {
            return (str || '')
                .toLowerCase()
                .replace(/[^a-z0-9\u00c0-\u017f\s]/gi, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function clearSpeechTimers() {
            if (activePreDelayTimer) { clearTimeout(activePreDelayTimer); activePreDelayTimer = null; }
            if (activePostDelayTimer) { clearTimeout(activePostDelayTimer); activePostDelayTimer = null; }
            if (speechFallbackTimer) { clearTimeout(speechFallbackTimer); speechFallbackTimer = null; }
            if (speechKeepAliveInterval) { clearInterval(speechKeepAliveInterval); speechKeepAliveInterval = null; }
        }

        function speakMeditationLine(englishText, onComplete = null, preDelayMs = 240, postDelayMs = 400, croatianSubtitle = '', paceMode = 'calm', autoClearSubtitleAfterMs = 0) {
            clearSpeechTimers();

            const voiceBars = document.getElementById('voice-bars');
            const profile = VOICE_PACE_PROFILES[paceMode] || VOICE_PACE_PROFILES.calm;

            activePreDelayTimer = setTimeout(() => {
                isRobotSpeaking = true;
                micIgnoreUntil = performance.now() + 900;
                updateMicUI();

                if (voiceBars) voiceBars.classList.remove('opacity-25');

                if (croatianSubtitle === null) {
                    showSubtitleText('');
                } else {
                    showSubtitleText(croatianSubtitle || englishText);
                }

                let finished = false;
                const finishSpeech = () => {
                    if (finished) return;
                    finished = true;
                    if (speechFallbackTimer) { clearTimeout(speechFallbackTimer); speechFallbackTimer = null; }
                    if (speechKeepAliveInterval) { clearInterval(speechKeepAliveInterval); speechKeepAliveInterval = null; }
                    window.__auraActiveUtterance = null;
                    isRobotSpeaking = false;
                    micIgnoreUntil = performance.now() + 650;
                    if (voiceBars) voiceBars.classList.add('opacity-25');

                    if (autoClearSubtitleAfterMs > 0) {
                        const expectedSub = (croatianSubtitle || englishText).trim();
                        setTimeout(() => {
                            if (!isRobotSpeaking && currentSubtitleText === expectedSub) {
                                showSubtitleText('');
                            }
                        }, autoClearSubtitleAfterMs);
                    }

                    activePostDelayTimer = setTimeout(() => {
                        updateMicUI();
                        if (typeof onComplete === 'function') onComplete();
                    }, postDelayMs);
                };

                const wordCount = englishText.trim().split(/\s+/).length;
                // Deterministic safety unlock so isRobotSpeaking can NEVER hang mid-meditation
                const estMs = Math.max(2600, Math.round((wordCount / (2.0 * profile.rate)) * 1000) + 1800);
                speechFallbackTimer = setTimeout(() => {
                    finishSpeech();
                }, estMs);

                if (!soundEnabled || !('speechSynthesis' in window)) {
                    logVoiceTerminal('AURA_SUB', `"${englishText}"`, 'cyan');
                    return;
                }

                try {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.resume();

                    const utter = new SpeechSynthesisUtterance(englishText);
                    window.__auraActiveUtterance = utter;
                    utter.lang = 'en-US';
                    utter.rate = profile.rate;
                    utter.pitch = profile.pitch;

                    const voice = selectBestNaturalVoice();
                    if (voice) utter.voice = voice;

                    logVoiceTerminal('AURA_TTS', `"${englishText}"`, 'cyan');

                    utter.onend = () => finishSpeech();
                    utter.onerror = () => finishSpeech();

                    window.speechSynthesis.speak(utter);

                    // Workaround for Chromium's speechSynthesis pause freeze bug
                    speechKeepAliveInterval = setInterval(() => {
                        if ('speechSynthesis' in window && window.speechSynthesis.paused) {
                            window.speechSynthesis.resume();
                        }
                    }, 1000);
                } catch (err) {
                    finishSpeech();
                }
            }, preDelayMs);
        }

        /***********************************************************************
         * 6. COMMAND 1: "TEST" DIAGNOSTICS ROUTINE
         ***********************************************************************/
        let diagTimers = [];

        function cancelDiagnosticsTest() {
            if (diagTimers.length) {
                diagTimers.forEach(t => clearTimeout(t));
                diagTimers = [];
            }
            if (isRunningDiagnosticsTest) {
                isRunningDiagnosticsTest = false;
                applySubtitleSettings('#f8fafc', 'md');
                showSubtitleText('');
            }
        }

        async function triggerTestManual() {
            loadBrowserVoices();
            initZenAudio();

            // Allow manual Test click anytime when not actively meditating (or restart test cleanly)
            if (isRunning || isTransitioningToStart) {
                isRunning = false;
                isTransitioningToStart = false;
                isHandlingVoiceReply = false;
                stopBackgroundChimes();
                clearSpeechTimers();
                if ('speechSynthesis' in window) {
                    try { window.speechSynthesis.cancel(); } catch (e) {}
                }
                const labelPlay = document.getElementById('label-play');
                const iconPlay = document.getElementById('icon-play');
                if (labelPlay) labelPlay.textContent = 'Meditation';
                if (iconPlay) iconPlay.className = 'ph-fill ph-play text-xs text-sky-300';
            }

            if (isRunningDiagnosticsTest) {
                cancelDiagnosticsTest();
            }

            runSystemDiagnosticsTest();
        }

        async function runSystemDiagnosticsTest() {
            if (isRunning || isRunningDiagnosticsTest || isTransitioningToStart) return;
            isRunningDiagnosticsTest = true;
            diagTimers = [];
            // Keep microphone active during test (only ignore speaker echo while test plays)
            micIgnoreUntil = performance.now() + 6800;
            setTerminalContextBadge('DIAG_TEST');

            const origColor = subtitleColor;
            const origSize = subtitleSizeKey;

            logVoiceTerminal('DIAG_INIT', 'running soft chimes & +10% subtitle test (mic stays ON)...', 'amber');
            await initZenAudio();

            // Preview delicate meditation chimes
            if (bgChimeSynth && soundEnabled) {
                try { bgChimeSynth.triggerAttackRelease('G4', '2n', undefined, 0.30); } catch (e) {}
                diagTimers.push(setTimeout(() => {
                    if (bgChimeSynth && soundEnabled) {
                        try { bgChimeSynth.triggerAttackRelease('C5', '2n', undefined, 0.28); } catch (e) {}
                    }
                }, 340));
                diagTimers.push(setTimeout(() => {
                    if (bgChimeSynth && soundEnabled) {
                        try { bgChimeSynth.triggerAttackRelease('E5', '2n', undefined, 0.26); } catch (e) {}
                    }
                }, 680));
            }
            logVoiceTerminal('AUDIO_CHK', 'soft background chimes G4-C5-E5 -> OK', 'cmd');

            speakMeditationLine(
                'Diagnostic check active.',
                null,
                120,
                280,
                'Test sustava: provjera zvončića i veličina titlova (+10%).',
                'calm'
            );

            const steps = [
                { delay: 950,  color: '#67e8f9', size: 'sm', label: 'Test titlova [S · Cijan] — glatki prijelaz.' },
                { delay: 2250, color: '#fde047', size: 'md', label: 'Test titlova [M · TV Žuta] — zadana veličina.' },
                { delay: 3550, color: '#f472b6', size: 'lg', label: 'Test titlova [L · Ružičasta] — kontrast u redu.' },
                { delay: 4850, color: '#6ee7b7', size: 'xl', label: 'Test titlova [XL · Menta] — čitljivo.' }
            ];

            steps.forEach((st) => {
                diagTimers.push(setTimeout(() => {
                    if (!isRunningDiagnosticsTest) return;
                    applySubtitleSettings(st.color, st.size);
                    showSubtitleText(st.label);
                    logVoiceTerminal('SUB_CHK', `size=${st.size.toUpperCase()} (+10%) color=${st.color} -> OK`, 'pink');
                }, st.delay));
            });

            diagTimers.push(setTimeout(() => {
                if (!isRunningDiagnosticsTest) return;
                applySubtitleSettings(origColor, origSize);
                showSubtitleText('');
                isRunningDiagnosticsTest = false;
                micIgnoreUntil = performance.now() + 300;
                diagTimers = [];
                if (!IS_FILE_PROTOCOL && micPermissionGranted && !micListeningPaused && !isListeningForCommand && speechRecognizer) {
                    try { speechRecognizer.start(); } catch (e) {}
                }
                updateMicUI();
                setTerminalContextBadge(isListeningForCommand ? 'READY' : 'STANDBY');
                setTerminalPromptStream(isListeningForCommand ? 'listening for "meditation" or "test"...' : 'click Mic or say "hi", "test", "meditation"');
                logVoiceTerminal('DIAG_PASS', 'test complete -> mic still active, ready for "meditation"', 'cmd');
            }, 6450));
        }

        /***********************************************************************
         * 7. VOICE RECOGNITION (NO MID-MEDITATION POPUPS + MULTI-ALT "TEST" MATCH)
         ***********************************************************************/
        const IS_FILE_PROTOCOL = window.location.protocol === 'file:';
        let speechRecognizer = null;
        let micPermissionGranted = false;
        let micListeningPaused = false;
        let micSuspendedByApp = false;
        let isListeningForCommand = false;
        let silenceWaitTimer = null;
        let accumulatedTranscript = '';
        let lastNonEmptyPreview = '';
        let lastAlternativesPool = [];

        function updateMicUI() {
            const btn = document.getElementById('btn-mic');
            const icon = document.getElementById('icon-mic');
            const label = document.getElementById('label-mic');
            if (!btn || !icon || !label) return;

            if (isRunning || isTransitioningToStart) {
                btn.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-900/80 text-sky-300/80 border border-sky-400/20 transition-all';
                icon.className = 'ph ph-microphone-slash text-xs sm:text-sm text-sky-300/70';
                label.textContent = 'Mic Off (Meditating)';
                return;
            }

            if (isCompleted && micListeningPaused && !isListeningForCommand) {
                btn.className = 'cursor-pointer active:scale-95 flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-900/85 hover:bg-slate-800 text-slate-300 border border-slate-600/50 transition-all';
                icon.className = 'ph ph-microphone-slash text-xs sm:text-sm text-slate-400';
                label.textContent = 'Mic Off';
                return;
            }

            if (!micPermissionGranted && !isListeningForCommand) {
                btn.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-200 border border-emerald-400/40 transition-all shadow-sm';
                icon.className = 'ph-fill ph-microphone text-xs sm:text-sm text-emerald-300';
                label.textContent = 'Allow Microphone';
                return;
            }

            if (micListeningPaused || (!isListeningForCommand && IS_FILE_PROTOCOL)) {
                btn.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 border border-amber-400/40 transition-all';
                icon.className = 'ph-fill ph-microphone text-xs sm:text-sm text-amber-300';
                label.textContent = 'Activate Mic';
                return;
            }

            if (isRobotSpeaking) {
                btn.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-sky-500/20 text-sky-200 border border-sky-400/35 transition-all';
                icon.className = 'ph-fill ph-waveform text-xs sm:text-sm text-sky-300';
                label.textContent = 'Aura Speaking...';
                return;
            }

            btn.className = 'flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] sm:text-xs font-medium bg-slate-800/80 text-emerald-300 border border-emerald-400/30 transition-all';
            icon.className = 'ph-fill ph-microphone text-xs sm:text-sm text-emerald-400';
            label.textContent = isListeningForCommand ? 'Listening...' : 'Mic Ready';
        }

        // Completely stops SpeechRecognition during meditation/test so browser NEVER re-prompts for mic mid-session
        function suspendMicDuringSession() {
            micSuspendedByApp = true;
            if (silenceWaitTimer) {
                clearTimeout(silenceWaitTimer);
                silenceWaitTimer = null;
            }
            accumulatedTranscript = '';
            lastNonEmptyPreview = '';
            lastAlternativesPool = [];
            if (speechRecognizer && isListeningForCommand) {
                try { speechRecognizer.stop(); } catch (e) {}
            }
            isListeningForCommand = false;
            updateMicUI();
        }

        // Only auto-restarts mic if permission is persistently granted (never forces unsolicited popup on file://)
        async function resumeMicAfterSessionIfPermitted() {
            micSuspendedByApp = false;
            if (micListeningPaused || !speechRecognizer || IS_FILE_PROTOCOL) {
                updateMicUI();
                return;
            }
            if (navigator.permissions && navigator.permissions.query) {
                try {
                    const status = await navigator.permissions.query({ name: 'microphone' });
                    if (status.state === 'granted' && !isListeningForCommand && !isRunning) {
                        try { speechRecognizer.start(); } catch (e) {}
                    }
                } catch (e) {}
            }
            updateMicUI();
        }

        function detectKnownCommandFromCandidates(candidates) {
            const normList = (candidates || []).map(normalizeSpeechText).filter(Boolean);
            if (!normList.length) return null;

            const matchWordT = (str) => /\bt[a-z0-9\u00c0-\u017f]*\b/i.test(str);
            const matchWordM = (str) => /\bm[a-z0-9\u00c0-\u017f]*\b/i.test(str);
            const matchGreeting = (str) => /\b(hi|hello|hey|high|halo|bok|pozdrav)\b/i.test(str);

            const primary = normList[0];

            // 1. Explicit primary keywords
            if (/\b(test|testing|provjera|testiraj)\b/i.test(primary)) return 'test';
            if (/\b(meditation|meditate|meditating|meditacija|meditaciju)\b/i.test(primary)) return 'meditation';

            // 2. Pure greeting ("hi" / "hello") when no T-word or M-word is spoken
            if (matchGreeting(primary) && !matchWordT(primary) && !matchWordM(primary)) {
                return 'greeting';
            }

            // 3. Any recognized word starting with "t" -> test, or starting with "m" -> meditation
            const primaryWords = primary.split(' ').filter(Boolean);
            for (const w of primaryWords) {
                if (w.startsWith('t')) return 'test';
                if (w.startsWith('m')) return 'meditation';
            }

            // 4. Fallback across phonetic alternatives
            for (let i = 1; i < normList.length; i++) {
                const alt = normList[i];
                const altWords = alt.split(' ').filter(Boolean);
                for (const w of altWords) {
                    if (w.startsWith('t')) return 'test';
                    if (w.startsWith('m')) return 'meditation';
                }
                if (matchGreeting(alt)) return 'greeting';
            }

            return null;
        }

        function buildSpeechRecognizer() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) return null;

            const rec = new SpeechRec();
            rec.lang = 'en-US';
            rec.continuous = true;
            rec.interimResults = true;
            // Inspect top 5 phonetic alternatives so short words like "test" are never missed
            rec.maxAlternatives = 5;

            rec.onstart = () => {
                isListeningForCommand = true;
                micPermissionGranted = true;
                updateMicUI();
                if (!isRunning) {
                    setTerminalPromptStream('listening for "hi", "test" or "meditation"...');
                }
            };

            rec.onresult = (event) => {
                if (isRobotSpeaking || isHandlingVoiceReply || isRunning || isRunningDiagnosticsTest || isTransitioningToStart || performance.now() < micIgnoreUntil) {
                    accumulatedTranscript = '';
                    lastNonEmptyPreview = '';
                    lastAlternativesPool = [];
                    if (silenceWaitTimer) {
                        clearTimeout(silenceWaitTimer);
                        silenceWaitTimer = null;
                    }
                    return;
                }

                let interim = '';
                let finalChunk = '';
                const currentAlts = [];

                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const res = event.results[i];
                    const primaryTxt = res[0] ? res[0].transcript : '';
                    for (let a = 0; a < res.length; a++) {
                        if (res[a] && res[a].transcript) {
                            currentAlts.push(res[a].transcript.trim());
                        }
                    }
                    if (res.isFinal) {
                        finalChunk += ' ' + primaryTxt;
                    } else {
                        interim += primaryTxt;
                    }
                }

                if (currentAlts.length) {
                    lastAlternativesPool = [...lastAlternativesPool, ...currentAlts].slice(-15);
                }

                if (finalChunk.trim()) {
                    accumulatedTranscript = (accumulatedTranscript + ' ' + finalChunk).trim();
                }

                const livePreview = (accumulatedTranscript + ' ' + interim).trim();
                // Preserve non-empty preview so trailing empty WebSpeech frames never wipe out "test"
                if (livePreview) {
                    lastNonEmptyPreview = livePreview;
                    if (!isRunning) {
                        setTerminalPromptStream(`rx_stream >> "${livePreview}"`);
                    }
                }

                const candidatePool = [
                    accumulatedTranscript,
                    livePreview,
                    lastNonEmptyPreview,
                    ...lastAlternativesPool
                ].filter(Boolean);

                const quickMatchedIntent = detectKnownCommandFromCandidates(candidatePool);

                if (silenceWaitTimer) clearTimeout(silenceWaitTimer);
                // Fast-track known commands (~260ms) so single-syllable "test" executes immediately
                const waitMs = quickMatchedIntent ? 260 : (finalChunk.trim() ? 380 : 780);

                silenceWaitTimer = setTimeout(() => {
                    const bestPhrase = (accumulatedTranscript || livePreview || lastNonEmptyPreview).trim();
                    const allCandidates = [bestPhrase, ...lastAlternativesPool].filter(Boolean);
                    accumulatedTranscript = '';
                    lastNonEmptyPreview = '';
                    lastAlternativesPool = [];

                    if (bestPhrase || allCandidates.length) {
                        processVoiceCommand(bestPhrase || allCandidates[0], allCandidates);
                    }
                }, waitMs);
            };

            rec.onerror = (event) => {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    micPermissionGranted = false;
                    isListeningForCommand = false;
                    updateMicUI();
                    logVoiceTerminal('MIC_LOCKED', 'click "Allow Microphone" in top bar to enable voice', 'warn');
                    setTerminalPromptStream('click "Allow Microphone" to enable voice...');
                }
            };

            rec.onend = async () => {
                isListeningForCommand = false;

                // Flush any pending spoken word ("test") that arrived right before recognition ended
                if (!isRunning && !isRunningDiagnosticsTest && !isTransitioningToStart && (accumulatedTranscript || lastNonEmptyPreview)) {
                    if (silenceWaitTimer) {
                        clearTimeout(silenceWaitTimer);
                        silenceWaitTimer = null;
                    }
                    const leftover = (accumulatedTranscript || lastNonEmptyPreview).trim();
                    const pool = [leftover, ...lastAlternativesPool].filter(Boolean);
                    accumulatedTranscript = '';
                    lastNonEmptyPreview = '';
                    lastAlternativesPool = [];
                    processVoiceCommand(leftover, pool);
                }

                updateMicUI();

                // Keep mic alive during/after test, but NEVER auto-restart during/after meditation or on file://
                if (micSuspendedByApp || micListeningPaused || isRunning || isTransitioningToStart || IS_FILE_PROTOCOL) {
                    return;
                }

                if (micPermissionGranted && navigator.permissions && navigator.permissions.query) {
                    try {
                        const status = await navigator.permissions.query({ name: 'microphone' });
                        if (status.state === 'granted') {
                            setTimeout(() => {
                                if (!micSuspendedByApp && !micListeningPaused && !isRunning && !isListeningForCommand) {
                                    try { rec.start(); } catch (e) {}
                                }
                            }, 400);
                        }
                    } catch (e) {}
                }
            };

            return rec;
        }

        function handleMicButtonClick() {
            // Warm up audio & voices WITHOUT awaiting before speechRecognizer.start() so user gesture stays intact
            initZenAudio();
            loadBrowserVoices();

            if (isRunning || isTransitioningToStart) {
                logVoiceTerminal('MIC_INFO', 'microphone stays off during meditation for peace', 'cyan');
                return;
            }

            if (isRunningDiagnosticsTest) {
                cancelDiagnosticsTest();
            }

            if (!speechRecognizer) {
                speechRecognizer = buildSpeechRecognizer();
            }

            if (!speechRecognizer) {
                logVoiceTerminal('ASR_UNSUP', 'Web Speech API unavailable -> use buttons or type "test" / "meditation"', 'warn');
                setTerminalPromptStream('browser Speech API unavailable -> use Test / Meditation buttons');
                return;
            }

            if (isListeningForCommand && !micListeningPaused) {
                micListeningPaused = true;
                try { speechRecognizer.stop(); } catch (e) {}
                isListeningForCommand = false;
                setTerminalContextBadge('MIC_PAUSED');
                setTerminalPromptStream('microphone paused // click "Activate Mic"');
                logVoiceTerminal('MIC_PAUSE', 'microphone paused by user', 'amber');
                updateMicUI();
                return;
            }

            micListeningPaused = false;
            micSuspendedByApp = false;
            try {
                speechRecognizer.start();
                micPermissionGranted = true;
                logVoiceTerminal('MIC_OK', 'activating microphone -> say "hi"/"hello", "test", or "meditation"', 'cmd');
                setTerminalContextBadge('READY');
                updateMicUI();
            } catch (err) {
                // Already started in browser engine
                isListeningForCommand = true;
                micPermissionGranted = true;
                logVoiceTerminal('MIC_READY', 'listening -> say "hi", "test" or "meditation"', 'amber');
                updateMicUI();
            }
        }

        async function bootMicrophoneOnLoad() {
            logVoiceTerminal('BOOT', 'AURA-ZEN 4:3 voxel engine initialized', 'info');
            logVoiceTerminal('RULES', 'active commands: "test", "meditation" (+ "hi"/"hello" greeting)', 'amber');

            // Never auto-trigger mic on file:// load without user click to avoid unsolicited browser popups
            if (IS_FILE_PROTOCOL) {
                updateMicUI();
                return;
            }

            if (navigator.permissions && navigator.permissions.query) {
                try {
                    const status = await navigator.permissions.query({ name: 'microphone' });
                    if (status.state === 'granted') {
                        speechRecognizer = buildSpeechRecognizer();
                        if (speechRecognizer) {
                            try {
                                speechRecognizer.start();
                                micPermissionGranted = true;
                                logVoiceTerminal('MIC_AUTO', 'microphone ready -> say "hi", "test" or "meditation"', 'cmd');
                                setTerminalContextBadge('READY');
                                updateMicUI();
                            } catch (e) {}
                        }
                    }
                } catch (e) {}
            }
        }

        /**
         * Strict Voice Command Handler (inspects primary phrase + phonetic alternatives):
         * - "hi" / "hello": Robot greets back warmly.
         * - "test": Runs diagnostic test.
         * - "meditation": Starts the full 2-minute guided meditation.
         */
        function processVoiceCommand(rawPhrase, allCandidates = []) {
            if (isRunning || isRunningDiagnosticsTest || isTransitioningToStart) return;

            const candidates = allCandidates.length ? allCandidates : [rawPhrase];
            const intent = detectKnownCommandFromCandidates(candidates);

            if (intent === 'test') {
                logVoiceTerminal('VOICE_CMD', `"${rawPhrase}" -> executing TEST`, 'cmd');
                runSystemDiagnosticsTest();
                return;
            }

            if (intent === 'meditation') {
                logVoiceTerminal('VOICE_CMD', `"${rawPhrase}" -> starting MEDITATION`, 'cmd');
                startMeditationSession();
                return;
            }

            if (intent === 'greeting') {
                logVoiceTerminal('GREETING', `"${rawPhrase}" -> greeting back`, 'cyan');
                greetUserBack();
                return;
            }

            if (rawPhrase) {
                logVoiceTerminal('IGNORED', `"${rawPhrase}" (say: "hi"/"hello", "test", or "meditation")`, 'warn');
                setTerminalPromptStream('listening for "hi", "test" or "meditation"...');
            }
        }

        /***********************************************************************
         * 9. THREE.JS 3D VOXEL ANDROID HEAD + RESPONSIVE 4:3 OBSERVER
         ***********************************************************************/
        let scene, camera, renderer, headGroup, shimmerLight;
        const skullVoxels = [];
        const eyeVoxels = [];
        const mouthVoxels = [];
        const holoParticles = [];

        let userRotX = 0;
        let userRotY = 0;
        let targetUserRotX = 0;
        let targetUserRotY = 0;
        let isDraggingOrb = false;
        let prevPointerX = 0;
        let prevPointerY = 0;

        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            if (!container) return;

            const rect = container.getBoundingClientRect();
            const w = Math.round(rect.width) || container.clientWidth || 340;
            const h = Math.round(rect.height) || container.clientHeight || 340;

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(36, w / h, 0.1, 100);
            camera.position.set(0, 0.15, 18.2);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xdbeafe, 0.72);
            scene.add(ambient);

            const keyLight = new THREE.DirectionalLight(0xe0f2fe, 1.15);
            keyLight.position.set(8, 12, 14);
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
            rimLight.position.set(-10, 4, -8);
            scene.add(rimLight);

            shimmerLight = new THREE.PointLight(0x67e8f9, 1.45, 28);
            shimmerLight.position.set(5, 3, 9);
            scene.add(shimmerLight);

            buildVoxelAndroidHead();
            setupOrbInteraction();

            window.addEventListener('resize', onOrbResize);
            if ('ResizeObserver' in window) {
