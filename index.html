        function buildVoxelAndroidHead() {
            headGroup = new THREE.Group();
            scene.add(headGroup);

            const voxelGeo = new THREE.BoxGeometry(0.86, 0.86, 0.86);

            const coreMat = new THREE.MeshStandardMaterial({
                color: 0x06101f,
                roughness: 0.25,
                metalness: 0.8
            });
            const visorCore = new THREE.Mesh(new THREE.BoxGeometry(6.8, 5.2, 5.4), coreMat);
            visorCore.position.set(0, 0.3, 0.2);
            headGroup.add(visorCore);

            const innerCore = new THREE.Mesh(
                new THREE.OctahedronGeometry(1.35, 0),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.45 })
            );
            innerCore.position.set(0, 0.4, 0);
            headGroup.add(innerCore);

            for (let x = -5; x <= 5; x++) {
                for (let y = -6; y <= 6; y++) {
                    for (let z = -4; z <= 4; z++) {
                        const nx = x / 5.1;
                        const ny = (y - 0.5) / 5.6;
                        const nz = z / 4.3;
                        const dist = nx * nx + ny * ny + nz * nz;

                        const isNeck = (y >= -6 && y <= -4 && Math.abs(x) <= 2 && Math.abs(z) <= 2 && (Math.abs(x) === 2 || Math.abs(z) === 2));
                        const isEarModule = (Math.abs(x) === 5 && y >= -1 && y <= 2 && z >= -1 && z <= 1);
                        const isShell = (dist >= 0.58 && dist <= 1.03 && y >= -4);
                        const inVisorCutout = (z >= 3 && Math.abs(x) <= 3 && y >= -2 && y <= 2);

                        if ((isShell && !inVisorCutout) || isNeck || isEarModule) {
                            const baseColor = isEarModule ? new THREE.Color(0x38bdf8) : new THREE.Color(0xcbd5e1);
                            const mat = new THREE.MeshPhysicalMaterial({
                                color: baseColor,
                                roughness: 0.22,
                                metalness: 0.58,
                                clearcoat: 0.9,
                                clearcoatRoughness: 0.15
                            });

                            const m = new THREE.Mesh(voxelGeo, mat);
                            m.position.set(x * 0.92, y * 0.92, z * 0.92);
                            headGroup.add(m);

                            skullVoxels.push({
                                mesh: m,
                                isEar: isEarModule,
                                phase: (x * 0.35) + (y * 0.28) + (z * 0.25)
                            });
                        }
                    }
                }
            }

            const eyeCoords = [
                [-2.2, 1.3], [-1.3, 1.3], [-2.2, 0.45], [-1.3, 0.45],
                [1.3, 1.3],  [2.2, 1.3],  [1.3, 0.45],  [2.2, 0.45]
            ];
            const eyeGeo = new THREE.BoxGeometry(0.76, 0.72, 0.45);
            eyeCoords.forEach(([ex, ey]) => {
                const eMat = new THREE.MeshBasicMaterial({ color: 0xbae6fd });
                const em = new THREE.Mesh(eyeGeo, eMat);
                em.position.set(ex, ey, 3.18);
                headGroup.add(em);
                eyeVoxels.push({ mesh: em });
            });

            const mouthXs = [-1.8, -0.9, 0, 0.9, 1.8];
            const mouthGeo = new THREE.BoxGeometry(0.72, 0.42, 0.42);
            mouthXs.forEach((mx, idx) => {
                const mMat = new THREE.MeshBasicMaterial({ color: 0x7dd3fc });
                const mm = new THREE.Mesh(mouthGeo, mMat);
                mm.position.set(mx, -1.25, 3.18);
                headGroup.add(mm);
                mouthVoxels.push({ mesh: mm, idx });
            });

            const holoGeo = new THREE.BoxGeometry(0.32, 0.32, 0.32);
            for (let i = 0; i < 18; i++) {
                const hMat = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? 0x67e8f9 : 0xa5b4fc,
                    transparent: true,
                    opacity: 0.55
                });
                const hm = new THREE.Mesh(holoGeo, hMat);
                const angle = (i / 18) * Math.PI * 2;
                const radius = 6.2 + (i % 3) * 0.65;
                const yOff = ((i % 5) - 2) * 1.4;
                headGroup.add(hm);
                holoParticles.push({ mesh: hm, angle, radius, yOff, speed: 0.25 + (i % 4) * 0.06 });
            }
        }

        function setupOrbInteraction() {
            const portal = document.getElementById('orb-portal');
            if (!portal) return;

            portal.addEventListener('pointerdown', (e) => {
                isDraggingOrb = true;
                prevPointerX = e.clientX;
                prevPointerY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDraggingOrb) return;
                const dx = e.clientX - prevPointerX;
                const dy = e.clientY - prevPointerY;
                prevPointerX = e.clientX;
                prevPointerY = e.clientY;

                targetUserRotY = Math.max(-0.75, Math.min(0.75, targetUserRotY + dx * 0.006));
                targetUserRotX = Math.max(-0.45, Math.min(0.45, targetUserRotX + dy * 0.005));
            });

            window.addEventListener('pointerup', () => {
                isDraggingOrb = false;
            });
        }

        function onOrbResize() {
            const container = document.getElementById('canvas-container');
            if (!container || !renderer || !camera) return;
            const w = container.clientWidth || 300;
            const h = container.clientHeight || 300;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        /***********************************************************************
         * 10. ANIMATION LOOP & COHERENT BREATHING CYCLE
         ***********************************************************************/
        const clock = new THREE.Clock();
        let lastTickTime = performance.now();
        let nextBlinkAt = 2.5;
        let blinkEndAt = 2.66;
        const tmpColor = new THREE.Color();

        function updateMeditationLogic(nowMs, elapsedSec) {
            const breathInstr = document.getElementById('breath-instruction');
            const halo = document.getElementById('breath-halo');

            if (!isRunning) {
                const idleScale = 1 + Math.sin(elapsedSec * 1.4) * 0.018;
                if (halo) {
                    halo.style.transform = `scale(${idleScale.toFixed(3)})`;
                    halo.style.borderColor = 'rgba(56, 189, 248, 0.24)';
                }
                return 0.5;
            }

            const dt = (nowMs - lastTickTime) / 1000;
            lastTickTime = nowMs;
            remainingSeconds = Math.max(0, remainingSeconds - dt);
            updateTimerUI(remainingSeconds);

            for (const cue of MEDITATION_CUES) {
                if (!cue.triggered && remainingSeconds <= cue.atRemaining && !isRobotSpeaking) {
                    cue.triggered = true;
                    // Each guided cue gently fades its subtitle 3.2s after speech ends so screen stays calm
                    speakMeditationLine(cue.en, null, 150, 300, cue.hr, 'meditation', 3200);
                    break;
                }
            }

            if (remainingSeconds <= 0) {
                remainingSeconds = 0;
                isRunning = false;
                isCompleted = true;
                updateTimerUI(0);
                stopBackgroundChimes();
                playCueChime('C5', 0.45);
                setTimeout(() => playCueChime('G5', 0.38), 650);

                // Keep microphone completely turned off after completed meditation
                micListeningPaused = true;
                suspendMicDuringSession();

                const labelPlay = document.getElementById('label-play');
                const iconPlay = document.getElementById('icon-play');
                const phaseBadge = document.getElementById('phase-badge');
                if (labelPlay) labelPlay.textContent = 'Meditation';
                if (iconPlay) iconPlay.className = 'ph-fill ph-play text-xs text-sky-300';
                if (breathInstr) breathInstr.textContent = 'THANK YOU';
                if (phaseBadge) phaseBadge.textContent = 'COMPLETE // 00:00';
                setTerminalContextBadge('COMPLETE // MIC OFF');
                setTerminalPromptStream('meditation complete // microphone turned off');
                logVoiceTerminal('MIC_OFF', 'meditation finished -> microphone turned off', 'amber');

                speakMeditationLine(
                    'Meditation complete. Gently open your eyes. Thank you all for your attention.',
                    () => {
                        updateMicUI();
                    },
                    400,
                    400,
                    'Meditacija je završena. Nježno otvorite oči. Hvala vam svima na pažnji.',
                    'meditation',
                    4800
                );
                return 0.5;
            }

            const elapsedMeditation = TOTAL_SECONDS - remainingSeconds;
            const cyclePos = elapsedMeditation % 10;
            let breathFactor = 0.5;

            if (cyclePos < 4) {
                breathFactor = cyclePos / 4;
                if (breathInstr) breathInstr.textContent = 'INHALE SLOWLY...';
            } else if (cyclePos < 6) {
                breathFactor = 1.0;
                if (breathInstr) breathInstr.textContent = 'HOLD GENTLY...';
            } else {
                breathFactor = 1.0 - ((cyclePos - 6) / 4);
                if (breathInstr) breathInstr.textContent = 'EXHALE SOFTLY...';
            }

            if (halo) {
                const haloScale = 0.98 + breathFactor * 0.065;
                halo.style.transform = `scale(${haloScale.toFixed(3)})`;
                halo.style.borderColor = `rgba(56, 189, 248, ${(0.2 + breathFactor * 0.35).toFixed(2)})`;
            }

            return breathFactor;
        }

        function updateVoxelHeadAnimation(elapsed, breathFactor) {
            if (!headGroup) return;

            if (!isDraggingOrb) {
                targetUserRotX *= 0.992;
                targetUserRotY *= 0.992;
            }
            userRotX += (targetUserRotX - userRotX) * 0.08;
            userRotY += (targetUserRotY - userRotY) * 0.08;

            const autoYaw = Math.sin(elapsed * 0.55) * 0.30;
            const autoPitch = Math.sin(elapsed * 0.38 + 0.9) * 0.11;
            const autoRoll = Math.cos(elapsed * 0.44) * 0.075;

            headGroup.rotation.y = autoYaw + userRotY;
            headGroup.rotation.x = autoPitch + userRotX;
            headGroup.rotation.z = autoRoll;
            headGroup.position.y = Math.sin(elapsed * 1.15) * 0.24 + (breathFactor - 0.5) * 0.22;

            if (shimmerLight) {
                shimmerLight.position.x = Math.sin(elapsed * 0.9) * 9;
                shimmerLight.position.y = Math.cos(elapsed * 0.65) * 6 + 2;
            }

            for (let i = 0; i < skullVoxels.length; i++) {
                const v = skullVoxels[i];
                const wave = 0.5 + 0.5 * Math.sin(elapsed * 1.65 + v.phase);
                if (v.isEar) {
                    tmpColor.setHSL(0.53 + wave * 0.06, 0.85, 0.52 + wave * 0.14);
                } else {
                    tmpColor.setHSL(0.55 + wave * 0.10, 0.28 + wave * 0.22, 0.72 + wave * 0.12);
                }
                v.mesh.material.color.copy(tmpColor);
            }

            if (elapsed > blinkEndAt) {
                nextBlinkAt = elapsed + 2.8 + Math.random() * 2.6;
                blinkEndAt = nextBlinkAt + 0.15;
            }
            const isBlinking = (elapsed >= nextBlinkAt && elapsed <= blinkEndAt);
            const targetEyeScaleY = isRunning ? 0.16 : (isBlinking ? 0.12 : 1.0);

            eyeVoxels.forEach((ev) => {
                ev.mesh.scale.y += (targetEyeScaleY - ev.mesh.scale.y) * 0.28;
            });

            for (let i = 0; i < mouthVoxels.length; i++) {
                const mv = mouthVoxels[i];
                if (isRobotSpeaking) {
                    const pulse = 0.65 + Math.abs(Math.sin(elapsed * 13.5 + mv.idx * 0.9)) * 1.65;
                    mv.mesh.scale.y = pulse;
                    mv.mesh.material.color.setHex(0x67e8f9);
                } else {
                    mv.mesh.scale.y += (0.55 - mv.mesh.scale.y) * 0.2;
                    mv.mesh.material.color.setHex(0x7dd3fc);
                }
            }

            if (isRobotSpeaking) {
                for (let b = 1; b <= 5; b++) {
                    const barEl = document.getElementById(`vb-${b}`);
                    if (barEl) {
                        const hPx = 5 + Math.round(Math.abs(Math.sin(elapsed * 12 + b * 1.1)) * 11);
                        barEl.style.height = `${hPx}px`;
                    }
                }
            }

            holoParticles.forEach((hp) => {
                const a = hp.angle + elapsed * hp.speed;
                hp.mesh.position.set(
                    Math.cos(a) * hp.radius,
                    hp.yOff + Math.sin(elapsed * 1.4 + hp.angle) * 0.45,
                    Math.sin(a) * hp.radius * 0.65
                );
                hp.mesh.rotation.x = elapsed * 0.8;
                hp.mesh.rotation.y = elapsed * 1.1;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            const breathFactor = updateMeditationLogic(performance.now(), elapsed);
            updateVoxelHeadAnimation(elapsed, breathFactor);
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        /***********************************************************************
         * 11. BOOTSTRAP ON WINDOW LOAD
         ***********************************************************************/
        window.onload = function () {
            document.documentElement.style.setProperty('--sub-color', subtitleColor);
            document.documentElement.style.setProperty('--sub-size', SUBTITLE_SIZE_MAP[subtitleSizeKey]);

            initThreeScene();
            requestAnimationFrame(onOrbResize);

            const unlockOnce = () => {
                initZenAudio();
                loadBrowserVoices();
                window.removeEventListener('pointerdown', unlockOnce);
                window.removeEventListener('keydown', unlockOnce);
            };
            window.addEventListener('pointerdown', unlockOnce, { passive: true });
            window.addEventListener('keydown', unlockOnce, { passive: true });

            bootMicrophoneOnLoad();
            animate();
        };
    </script>
</body>
